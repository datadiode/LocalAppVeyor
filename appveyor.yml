image: Visual Studio 2022

version: 0.6.0+appveyor.{build}

init:
  - dotnet --info
  - git config --global core.autocrlf true

configuration: release

build_script:
  - for /F "tokens=1,2 delims=v-" %%x in ('git describe') do set VERSION=%%x.%%y
  - dotnet build -p:Version=%VERSION% src\LocalAppVeyor.Engine --configuration %configuration%
  - dotnet build -p:Version=%VERSION% src\LocalAppVeyor --configuration %configuration%

after_build:
  - dotnet pack src\LocalAppVeyor.Engine --configuration %configuration% --output out_engine
  - dotnet pack src\LocalAppVeyor --configuration %configuration% --output out_console
  - 7z a out_console\LocalAppVeyor.%VERSION%.nupkg src\LocalAppVeyor\bin\Release\net8.0\LocalAppVeyor.exe
  - 7z rn out_console\LocalAppVeyor.%VERSION%.nupkg src/LocalAppVeyor/bin/Release/net8.0/LocalAppVeyor.exe tools/net8.0/any/LocalAppVeyor.exe

test_script:
  - dotnet test tests\LocalAppVeyor.Engine.UnitTests\LocalAppVeyor.Engine.UnitTests.csproj --configuration %configuration%

artifacts:
  - path: out_engine\*.nupkg
    name: engine_packages
  - path: out_console\*.nupkg
    name: console_packages

deploy:
  provider: GitHub
  tag: $(APPVEYOR_REPO_TAG_NAME)
  on:
    APPVEYOR_REPO_TAG: true
  auth_token:
    secure: KoZ7nAgzOu1PExQ0Fdqaj22snLyhuY/YIa24yebq/0u2TXedv24XEHqcGPrjoDtn
